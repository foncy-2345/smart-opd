<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart OPD - โรงพยาบาลอัจฉริยะ</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>

<body>

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">

      <div class="login-brand">
  <div class="brand-text">
    <h1>SMART OPD</h1>
    <p>โรงพยาบาลอัจฉริยะ</p>
  </div>
  <div class="brand-icon">✚</div>
</div>

<h2>เข้าสู่ระบบ</h2>

      <form id="loginForm">
        <label>เลขบัตรประชาชน</label>
        <input type="text" id="loginCitizen"
          maxlength="13" inputmode="numeric"
          placeholder="กรอกเลขบัตรประชาชน 13 หลัก"
          autocomplete="off" required>

        <label>เบอร์โทรศัพท์</label>
        <input type="tel" id="loginPhone"
          maxlength="10" inputmode="numeric"
          placeholder="กรอกเบอร์โทรศัพท์"
          autocomplete="off" required>

        <button type="submit" class="login-button">
          เข้าสู่ระบบ
        </button>
      </form>

      <div class="login-divider">หรือ</div>

      <button type="button" id="showRegister" class="register-button">
        สมัครสมาชิกใหม่
      </button>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none;">
        <h2>สมัครสมาชิก</h2>

        <label>ชื่อ-นามสกุล</label>
        <input type="text" id="registerName"
          placeholder="กรอกชื่อและนามสกุล" required>

        <label>เลขบัตรประชาชน</label>
        <input type="text" id="registerCitizen"
          maxlength="13" inputmode="numeric"
          placeholder="เลขบัตรประชาชน 13 หลัก"
          autocomplete="off" required>

        <label>เบอร์โทรศัพท์</label>
        <input type="tel" id="registerPhone"
          maxlength="10" inputmode="numeric"
          placeholder="เบอร์โทรศัพท์ 10 หลัก"
          autocomplete="off" required>

        <button type="submit" class="login-button">
          สมัครสมาชิก
        </button>

        <button type="button" id="backToLogin" class="register-button">
          กลับหน้าเข้าสู่ระบบ
        </button>
      </form>

      <p class="login-footer">
        Smart OPD | Healthcare Service
      </p>
    </div>
  </section>


  <!-- MAIN APPLICATION -->
  <div class="app" id="appRoot" style="display:none;">

    <header class="main-header">

  <div class="header-brand">
    <div class="header-brand-text">
      <h1>SMART OPD</h1>
      <p>โรงพยาบาลอัจฉริยะ</p>
    </div>
  </div>

  <button class="notification"
    type="button"
    onclick="showTab('notifications')"
    aria-label="การแจ้งเตือน">
    🔔
  </button>

</header>


    <!-- MAIN CONTENT -->
    <main>

     <section class="services">
  <h2>บริการของเรา</h2>
  <div class="service-grid">
<button class="service-card appointment" onclick="openPage('appointment')">
  <span>📅 นัดหมายออนไลน์</span>
</button>
<button class="service-card booking" onclick="openPage('booking')">
  <span>🏥 จองคิวตรวจรักษา</span>
</button>
<button class="service-card results" onclick="openPage('results')">
  <span>📄 ผลตรวจและใบสั่งยา</span>
</button>
<button class="service-card family" onclick="openPage('family')">
  <span>👨‍👩‍👧 ดูแลครอบครัว</span>
</button>
<button class="service-card blood" onclick="openPage('blood')">
  <span>🩸 เจาะเลือดใกล้บ้าน</span>
</button>
<button class="service-card rights" onclick="openPage('rights')">
  <span>🛡️ สิทธิ์และชำระเงิน</span>
</button>
<button class="service-card delivery" onclick="openPage('delivery')">
  <span>🚚 จัดส่งยาถึงบ้าน</span>
</button>
<button class="service-card tracking" onclick="openPage('tracking')">
  <span>📦 ติดตามพัสดุ</span>
</button>
<button class="service-card certificate" onclick="openPage('certificate')">
  <span>📋 ใบรับรองแพทย์ดิจิทัล</span>
</button>
  </div>
</section>
      <section class="appointment">
        <h2>นัดหมายล่าสุด</h2>
        <p>ยังไม่มีข้อมูลนัดหมาย</p>
      </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <footer class="bottom-nav">

      <button type="button"
        onclick="showTab('home')"
        id="navHome">
        <span>🏠</span>
        <small>หน้าหลัก</small>
      </button>

      <button type="button"
        onclick="showTab('history')"
        id="navHistory">
        <span>📋</span>
        <small>ประวัติ</small>
      </button>

      <button type="button"
        onclick="showTab('notifications')"
        id="navNotifications">
        <span>🔔</span>
        <small>แจ้งเตือน</small>
        <i id="notificationBadge" style="display:none;">0</i>
      </button>

      <button type="button"
        onclick="showTab('settings')"
        id="navSettings">
        <span>⚙️</span>
        <small>ตั้งค่า</small>
      </button>

    </footer>

  </div>

  <script src="script.js?v=11"></script>

</body>
</html>
